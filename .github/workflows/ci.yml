name: CI

on:
  push:
    branches:
      - main # deploys to prod

    tags:
      - '*-beta.*' # ensures it is deployed to stage in case `main`` is not pushed to

  pull_request:
    branches:
      - main # deploys to dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx --bun tsc --noEmit

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun run test

  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      contains_release: ${{ steps.check_release.outputs.contains_release }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Release Check
        id: check_release
        run: |
          if git log --format=%B -n 1 "${{ github.event.after }}" | grep -qi 'release'; then
            echo "contains_release=1" >> "$GITHUB_OUTPUT"
          else
            echo "contains_release=0" >> "$GITHUB_OUTPUT"
          fi

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-check.outputs.contains_release == '0'
    needs: [lint, typecheck, test, release-check]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      # set the .env file
      - name: Ensure .env Set
        run: |
          cp .env.example .env

      # config/cloud.ts declares `provider: 'hetzner'`, so AWS keys were never
      # the credentials this deploy needs - it wants an SSH key and an hcloud
      # token. Gating on AWS meant the step below was skipped on every run
      # while the job still reported success: the box sat two weeks stale
      # behind a green tick on every push.
      - name: Check Deploy Credentials
        id: deploy-credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$HCLOUD_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            # A warning annotation rather than a bare log line: this surfaces
            # on the run itself, so "shipped a release" and "did nothing" stop
            # looking identical from the outside.
            echo "::warning title=Production deploy skipped::DEPLOY_SSH_KEY and HCLOUD_TOKEN are not set on this repository, so nothing was deployed. This job is green because the build passed, not because a release shipped."
            {
              echo "### Production deploy skipped - no credentials"
              echo "Set \`DEPLOY_SSH_KEY\` and \`HCLOUD_TOKEN\` on this repository to enable deploys."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.deploy-credentials.outputs.available == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: bun buddy deploy production --yes

  deploy-stage:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-beta.'))
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Ensure .env Set
        run: cp .env.example .env

      # config/cloud.ts declares `provider: 'hetzner'`, so AWS keys were never
      # the credentials this deploy needs - it wants an SSH key and an hcloud
      # token. Gating on AWS meant the step below was skipped on every run
      # while the job still reported success: the box sat two weeks stale
      # behind a green tick on every push.
      - name: Check Deploy Credentials
        id: deploy-credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$HCLOUD_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            # A warning annotation rather than a bare log line: this surfaces
            # on the run itself, so "shipped a release" and "did nothing" stop
            # looking identical from the outside.
            echo "::warning title=Staging deploy skipped::DEPLOY_SSH_KEY and HCLOUD_TOKEN are not set on this repository, so nothing was deployed. This job is green because the build passed, not because a release shipped."
            {
              echo "### Staging deploy skipped - no credentials"
              echo "Set \`DEPLOY_SSH_KEY\` and \`HCLOUD_TOKEN\` on this repository to enable deploys."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.deploy-credentials.outputs.available == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: bun buddy deploy staging --yes

  deploy-dev:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Ensure .env Set
        run: cp .env.example .env

      # config/cloud.ts declares `provider: 'hetzner'`, so AWS keys were never
      # the credentials this deploy needs - it wants an SSH key and an hcloud
      # token. Gating on AWS meant the step below was skipped on every run
      # while the job still reported success: the box sat two weeks stale
      # behind a green tick on every push.
      - name: Check Deploy Credentials
        id: deploy-credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$HCLOUD_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            # A warning annotation rather than a bare log line: this surfaces
            # on the run itself, so "shipped a release" and "did nothing" stop
            # looking identical from the outside.
            echo "::warning title=Development deploy skipped::DEPLOY_SSH_KEY and HCLOUD_TOKEN are not set on this repository, so nothing was deployed. This job is green because the build passed, not because a release shipped."
            {
              echo "### Development deploy skipped - no credentials"
              echo "Set \`DEPLOY_SSH_KEY\` and \`HCLOUD_TOKEN\` on this repository to enable deploys."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.deploy-credentials.outputs.available == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: bun buddy deploy development --yes

  publish-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish Commit
        run: ./storage/framework/scripts/publish-commit
