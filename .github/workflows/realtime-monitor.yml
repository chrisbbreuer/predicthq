name: Production Realtime Check

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Probe public HTTP/2 and WebSocket
        shell: bash
        run: |
          result=0
          bun --no-env-file .github/scripts/check-realtime.ts | tee realtime-check.json || result=$?
          {
            printf '### Public realtime probe\n\n```json\n'
            cat realtime-check.json
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Retain timing data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: realtime-check-${{ github.run_attempt }}
          path: realtime-check.json
          retention-days: 14
